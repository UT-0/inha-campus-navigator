<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Interactive campus map with shortest walking routes, building information and course search."
    />
    <meta name="theme-color" content="#0b2a5b" />
    <title>Inha Campus Navigator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('icn.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <a class="skip-link" href="#sheet-content" data-i18n="a11y.skipToPanel"
        >Skip to route planner</a
      >

      <header class="app-header" id="app-header">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#0b2a5b" />
            <path
              d="M32 7c-10.8 0-19.5 8.5-19.5 19.1C12.5 40.2 32 57 32 57s19.5-16.8 19.5-30.9C51.5 15.5 42.8 7 32 7z"
              fill="#3d8bff"
            />
            <path d="M20.5 19.8c4-1.3 7.9-.9 11 1.3v14.3c-3.1-2.1-7-2.5-11-1.3z" fill="#fff" />
            <path d="M43.5 19.8c-4-1.3-7.9-.9-11 1.3v14.3c3.1-2.1 7-2.5 11-1.3z" fill="#fff" />
          </svg>
          <h1 class="brand-title" data-i18n="app.title">Inha Campus Navigator</h1>
        </div>
        <div class="header-actions" id="settings"></div>
      </header>

      <div class="search-area" id="search-area" role="search"></div>

      <section class="sheet" id="sheet" aria-labelledby="sheet-title">
        <h2 class="sr-only" id="sheet-title" data-i18n="a11y.panel">
          Route planner and building information
        </h2>
        <button
          class="sheet-handle"
          id="sheet-handle"
          type="button"
          aria-controls="sheet-content"
          aria-expanded="false"
        >
          <span class="sheet-grabber" aria-hidden="true"></span>
        </button>
        <div class="sheet-content" id="sheet-content" tabindex="-1">
          <div class="view" id="route-view">
            <div id="route-panel"></div>
            <div id="route-result"></div>
            <div id="building-list"></div>
          </div>
          <div class="view" id="building-view" hidden></div>
          <div class="view" id="info-view" hidden></div>
        </div>
      </section>

      <main class="map-area" id="map-area">
        <svg id="map" class="map" aria-labelledby="map-title" role="img">
          <title id="map-title">Campus map</title>
        </svg>
        <div class="map-loading" id="map-loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span data-i18n="app.loading">Loading campus map…</span>
        </div>
        <div class="map-filters" id="map-filters"></div>
        <div class="map-top-right">
          <div class="map-compass" id="compass"></div>
          <div class="map-controls" id="map-controls"></div>
        </div>
        <div class="map-scale" id="scale-bar"></div>
        <a
          class="map-attribution"
          href="https://www.openstreetmap.org/copyright"
          target="_blank"
          rel="noopener"
          >© OpenStreetMap contributors</a
        >
        <div class="map-legend" id="legend"></div>
        <div class="sample-banner" id="sample-banner" hidden></div>
        <div class="map-tooltip" id="tooltip" role="tooltip" hidden></div>
      </main>

      <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
      <div class="sr-only" id="announcer" aria-live="assertive"></div>
    </div>

    <div class="error-screen" id="error-screen" role="alert" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
